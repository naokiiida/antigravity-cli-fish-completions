name: Update Claude CLI Completions

on:
  schedule:
    - cron: "0 12 * * *" # Check once daily at 12:00 PM UTC
  workflow_dispatch: # Allow manual trigger (skips version check)

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_update: ${{ steps.check.outputs.should_update }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for new Claude CLI version on npm
        id: check
        run: |
          CURRENT=$(cat claude-version 2>/dev/null || echo "0.0.0")
          LATEST=$(curl -s https://registry.npmjs.org/@anthropic-ai/claude-code/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")

          echo "Current: $CURRENT"
          echo "Latest:  $LATEST"
          echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$LATEST" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No new version"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected (or manual trigger)"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          fi

  update-completions:
    needs: check-version
    if: needs.check-version.outputs.should_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install fish shell
        run: |
          sudo apt-add-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Install Claude CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Add Claude to PATH
        run: echo "$HOME/.claude/bin" >> $GITHUB_PATH

      - name: Run drift check
        id: drift
        run: |
          if fish scripts/drift-check.fish 2>&1 | tee /tmp/drift-report.txt; then
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream CHANGELOG
        if: steps.drift.outputs.has_drift == 'true'
        run: |
          CURRENT=$(cat claude-version 2>/dev/null || echo "0.0.0")
          curl -s https://raw.githubusercontent.com/anthropics/claude-code/refs/heads/main/CHANGELOG.md \
            | sed -n "/^## $CURRENT/q;p" > /tmp/upstream-changelog.txt

      - name: Update version file
        env:
          NEW_VERSION: ${{ needs.check-version.outputs.new_version }}
        run: echo "$NEW_VERSION" > claude-version

      - name: Fix drift with Claude
        if: steps.drift.outputs.has_drift == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CHANGELOG_CONTEXT=""
          if [ -s /tmp/upstream-changelog.txt ]; then
            CHANGELOG_CONTEXT="

          Upstream Claude Code CHANGELOG (changes since tracked version):
          $(cat /tmp/upstream-changelog.txt)

          Use this to understand what CLI changes to expect (new flags, renamed commands, removed options)."
          fi

          claude -p "The drift-check found mismatches between completions/claude.fish and the current claude CLI.

          Drift report:
          $(cat /tmp/drift-report.txt)
          ${CHANGELOG_CONTEXT}

          Fix the completion file to resolve all MISSING items. Follow the patterns in .claude/skills/update-completions.md for completion syntax.
          Run 'claude <subcommand> --help' to get the exact flags and descriptions for any new or changed commands.
          Update CHANGELOG.md with the changes.
          Do NOT create a PR — only update files locally." \
            --dangerously-skip-permissions

      - name: Verify completion script (static)
        run: fish scripts/verify-completions.fish

      - name: Verify drift resolved
        if: steps.drift.outputs.has_drift == 'true'
        run: fish scripts/drift-check.fish

      - name: Create PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NEW_VERSION: ${{ needs.check-version.outputs.new_version }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          SUFFIX=$(head -c 6 /dev/urandom | xxd -p | head -c 6)
          BRANCH_NAME="auto-update/claude-completions-v${NEW_VERSION}-${SUFFIX}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"

          claude -p "Review the current git changes (use git diff and git status), then commit all changes and create a PR with a clear summary of what changed in the completion script. The branch is already created." \
            --dangerously-skip-permissions --allowedTools "Bash(git:*),Bash(gh:*)"
